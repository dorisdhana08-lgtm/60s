name: 微信每日新闻

on:
  schedule:
    # 北京时间每天 10:30
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: 获取新闻并推送到微信
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          sendkey = os.environ.get("SERVERCHAN_SENDKEY", "").strip()

          if not sendkey:
              raise RuntimeError(
                  "未读取到 SERVERCHAN_SENDKEY，请检查 Actions Secret"
              )

          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          dates = [today, today - timedelta(days=1)]

          data = None
          last_error = None

          for date_value in dates:
              date_text = date_value.isoformat()

              urls = [
                  f"https://60s-static.viki.moe/60s/{date_text}.json",
                  (
                      "https://cdn.jsdelivr.net/gh/"
                      "vikiboss/60s-static-host@main/static/60s/"
                      f"{date_text}.json"
                  ),
              ]

              for url in urls:
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0 daily-wechat/1.0",
                              "Accept": "application/json",
                          },
                      )

                      with urllib.request.urlopen(
                          request, timeout=30
                      ) as response:
                          candidate = json.load(response)

                      candidate = candidate.get("data", candidate)

                      if candidate.get("news"):
                          data = candidate
                          break

                  except Exception as error:
                      last_error = error
                      print(f"数据源请求失败：{url}：{error}")

              if data:
                  break

          if not data:
              raise RuntimeError(
                  f"今天和昨天的新闻均获取失败：{last_error}"
              )

          news_date = data.get("date", "今日")
          news = data.get("news", [])
          tip = data.get("tip", "")
          image = data.get("image", "")
          source_link = data.get(
              "link",
              "https://github.com/vikiboss/60s"
          )

          sections = []

          if image:
              sections.append(f"![每日新闻]({image})")

          sections.extend(
              f"**{index}.** {item}"
              for index, item in enumerate(news, 1)
          )

          if tip:
              sections.append(f"> {tip}")

          sections.append(f"[查看来源]({source_link})")

          form = urllib.parse.urlencode({
              "title": f"{news_date}｜每天 60 秒读懂世界",
              "desp": "\n\n".join(sections),
          }).encode("utf-8")

          endpoint = f"https://sctapi.ftqq.com/{sendkey}.send"
          push_request = urllib.request.Request(
              endpoint,
              data=form,
              headers={
                  "User-Agent": "Mozilla/5.0 daily-wechat/1.0",
                  "Content-Type": (
                      "application/x-www-form-urlencoded"
                  ),
              },
              method="POST",
          )

          with urllib.request.urlopen(
              push_request, timeout=30
          ) as response:
              result = json.load(response)

          if result.get("code") != 0:
              raise RuntimeError(
                  f"Server酱推送失败：{result}"
              )

          print("微信推送成功")
          PY
