name: 每日60秒微信推送

on:
  schedule:
    # UTC 02:30 = 北京时间 10:30
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: 获取新闻并推送到微信
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          sendkey = os.environ["SERVERCHAN_SENDKEY"]

      from datetime import datetime, timedelta
from zoneinfo import ZoneInfo

today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
dates = [today, today - timedelta(days=1)]

data = None
last_error = None

for date_value in dates:
    date_text = date_value.isoformat()

    urls = [
        f"https://60s-static.viki.moe/60s/{date_text}.json",
        (
            "https://cdn.jsdelivr.net/gh/"
            "vikiboss/60s-static-host@main/static/60s/"
            f"{date_text}.json"
        ),
    ]

    for url in urls:
        try:
            request = urllib.request.Request(
                url,
                headers={
                    "User-Agent": "Mozilla/5.0 daily-60s-wechat/1.0",
                    "Accept": "application/json",
                },
            )

            with urllib.request.urlopen(request, timeout=30) as response:
                candidate = json.load(response)

            if candidate.get("news"):
                data = candidate
                break

        except Exception as error:
            last_error = error

    if data:
        break

if not data:
    raise RuntimeError(
        f"今天和昨天的新闻均获取失败：{last_error}"
    )
          date = data.get("date", "今日")
          news = data.get("news", [])
          tip = data.get("tip", "")
          image = data.get("image", "")
          source = data.get("link", "https://github.com/vikiboss/60s")

          if not news:
              raise RuntimeError("60s API 未返回新闻数据")

          lines = [f"## {date} 每天60秒读懂世界"]

          if image:
              lines.extend(["", f"![每日新闻]({image})"])

          lines.extend([
              "",
              *[f"{index}. {item}" for index, item in enumerate(news, 1)],
          ])

          if tip:
              lines.extend(["", "---", "", f"> {tip}"])

          lines.extend(["", f"[查看数据来源]({source})"])
          content = "\n\n".join(lines)

          body = urllib.parse.urlencode({
              "title": f"{date}｜每天60秒读懂世界",
              "desp": content,
          }).encode("utf-8")

          endpoint = f"https://sctapi.ftqq.com/{sendkey}.send"
          push_request = urllib.request.Request(
              endpoint,
              data=body,
              method="POST",
          )

          with urllib.request.urlopen(push_request, timeout=30) as response:
              push_result = json.load(response)

          if push_result.get("code") != 0:
              raise RuntimeError(
                  "Server酱推送失败：" +
                  json.dumps(push_result, ensure_ascii=False)
              )

          print("微信推送成功")
          PY
